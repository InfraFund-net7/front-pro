# Nginx reverse proxy for InfraFund Dashboard — Development
# Cloudflare proxies HTTPS; this VM serves both HTTP (80) and HTTPS (443)
# with a self-signed cert (Cloudflare Full SSL mode accepts self-signed).
#
# SSL cert generation (one-time, on the VM):
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/dash-dev.infrafund.net.key \
#     -out /etc/ssl/certs/dash-dev.infrafund.net.crt \
#     -subj '/CN=dash-dev.infrafund.net/O=InfraFund/C=GB'
#
# Place at: /etc/nginx/sites-available/dashboard-dev.conf
# Enable:   ln -s /etc/nginx/sites-available/dashboard-dev.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen 443 ssl;
    server_name dash-dev.infrafund.net;

    ssl_certificate     /etc/ssl/certs/dash-dev.infrafund.net.crt;
    ssl_certificate_key /etc/ssl/private/dash-dev.infrafund.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js static assets — long cache TTL (immutable hashed filenames)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other traffic proxied to the Next.js container (host port 3001)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
