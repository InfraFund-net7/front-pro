services:
  dashboard:
    image: infrafund.azurecr.io/infra-dashboard:dev
    container_name: infra-dashboard-dev
    restart: unless-stopped
    ports:
      # Bind to localhost only — nginx handles external traffic on 80/443
      - '127.0.0.1:3001:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side secrets — injected at deploy time via --env-file, never baked into the image
      - DATABASE_URL=${DATABASE_URL}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      # Privy: NEXT_PUBLIC_PRIVY_APP_ID is also read server-side (see server/env.ts)
      - NEXT_PUBLIC_PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME}
    networks:
      - default
      # Join the shared internal network so this container can reach the
      # infra-postgres container via its 'postgres' hostname alias
      - internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  internal:
    external: true
