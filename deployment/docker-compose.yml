services:
  dashboard:
    image: infrafund.azurecr.io/infra-dashboard:prod
    container_name: infra-dashboard-prod
    restart: unless-stopped
    ports:
      # Bind to localhost only — nginx handles external traffic on 80/443
      # Port 3000 is occupied by landing-app on this VM; dashboard uses 3001
      - '127.0.0.1:3001:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side secrets — injected at deploy time via --env-file, never baked into the image
      - OPENFORT_SHIELD_SECRET_KEY=${OPENFORT_SHIELD_SECRET_KEY}
      - OPENFORT_SHIELD_ENCRYPTION_SHARE=${OPENFORT_SHIELD_ENCRYPTION_SHARE}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
