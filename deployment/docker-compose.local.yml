services:
  postgres:
    image: postgres:18-alpine
    container_name: infrafund-front-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infra_dev
    ports:
      - '5432:5432'
    volumes:
      - front_pro_postgres_data:/var/lib/postgresql/data
      - ./local-postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d infra_dev']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  front_pro_postgres_data:
