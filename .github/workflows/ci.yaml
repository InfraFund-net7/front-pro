name: CI

on:
  pull_request:
    branches: ['develop', 'main']
  push:
    branches: ['develop', 'main']

jobs:
  build:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, format, spelling, and unused-export checks
        run: npm run format

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Format-only placeholders -- Privy validates the app ID's shape
          # client-side at build/prerender time but makes no network call,
          # so a real app ID/secret isn't needed for the build to succeed.
          NEXT_PUBLIC_PRIVY_APP_ID: cmci0000000000000000000ci
          NEXT_PUBLIC_ENVIRONMENT: ci
          APP_JWT_SECRET: ci-placeholder-secret-not-used-at-runtime
