name: Deploy to Dev Environment
on:
  push:
    branches: ['develop']

jobs:
  build:
    name: Build and push Docker image
    runs-on: [self-hosted, dev]
    env:
      ACR_REGISTRY: infrafund.azurecr.io
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to ACR
        run: echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Build and push Docker image
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build \
            -f ./deployment/Dockerfile \
            --build-arg NEXT_PUBLIC_OPENFORT_PUBLIC_KEY=${{ secrets.DEV_OPENFORT_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SHIELD_API_KEY=${{ secrets.DEV_OPENFORT_SHIELD_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.DEV_RECAPTCHA_SITE_KEY }} \
            --build-arg NEXT_PUBLIC_POLICY_ID=${{ secrets.DEV_POLICY_ID }} \
            --build-arg NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.DEV_WALLET_CONNECT_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=development \
            -t "$ACR_REGISTRY/infra-dashboard:dev" \
            -t "$ACR_REGISTRY/infra-dashboard:dev-$SHA" .
          docker push "$ACR_REGISTRY/infra-dashboard:dev"
          docker push "$ACR_REGISTRY/infra-dashboard:dev-$SHA"

  deploy:
    name: Deploy to Development Server
    runs-on: [self-hosted, dev]
    needs: build
    env:
      COMPOSE_FILE: ${{ vars.DOCKER_COMPOSE_PATH_DEVELOP }}
    steps:
      - name: Write runtime secrets to env file
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          OPENFORT_SECRET_KEY: ${{ secrets.DEV_OPENFORT_SECRET_KEY }}
          OPENFORT_PUBLISHABLE_KEY: ${{ secrets.DEV_OPENFORT_PUBLISHABLE_KEY }}
          APP_JWT_SECRET: ${{ secrets.DEV_APP_JWT_SECRET }}
          OPENFORT_SHIELD_SECRET_KEY: ${{ secrets.DEV_OPENFORT_SHIELD_SECRET_KEY }}
          OPENFORT_SHIELD_ENCRYPTION_SHARE: ${{ secrets.DEV_OPENFORT_SHIELD_ENCRYPTION_SHARE }}
          OPENFORT_SHIELD_PUBLISHABLE_KEY: ${{ secrets.DEV_OPENFORT_SHIELD_PUBLISHABLE_KEY }}
        run: |
          printf 'DATABASE_URL=%s\nOPENFORT_SECRET_KEY=%s\nOPENFORT_PUBLISHABLE_KEY=%s\nAPP_JWT_SECRET=%s\nOPENFORT_SHIELD_SECRET_KEY=%s\nOPENFORT_SHIELD_ENCRYPTION_SHARE=%s\nOPENFORT_SHIELD_PUBLISHABLE_KEY=%s\n' \
            "$DATABASE_URL" \
            "$OPENFORT_SECRET_KEY" \
            "$OPENFORT_PUBLISHABLE_KEY" \
            "$APP_JWT_SECRET" \
            "$OPENFORT_SHIELD_SECRET_KEY" \
            "$OPENFORT_SHIELD_ENCRYPTION_SHARE" \
            "$OPENFORT_SHIELD_PUBLISHABLE_KEY" \
            > /tmp/dashboard-dev.env

      - name: Deploy with Docker Compose
        run: |
          docker compose -f "$COMPOSE_FILE" \
            --env-file /tmp/dashboard-dev.env \
            up -d dashboard --force-recreate

      - name: Wait for healthy state
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-dashboard-dev 2>/dev/null || echo "unknown")
            echo "Attempt $i/12 — health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Container did not become healthy within 60s"
          docker compose -f "$COMPOSE_FILE" logs --tail=50 dashboard
          exit 1

      - name: Cleanup temp env file
        if: always()
        run: rm -f /tmp/dashboard-dev.env
