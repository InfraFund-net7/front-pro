name: Deploy to Production Environment
on:
  push:
    branches: ['main']

jobs:
  build:
    name: Build and push Docker image
    runs-on: [self-hosted, prod]
    env:
      ACR_REGISTRY: infrafund.azurecr.io
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to ACR
        run: echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Build and push Docker image
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build \
            -f ./deployment/Dockerfile \
            --build-arg NEXT_PUBLIC_OPENFORT_PUBLIC_KEY=${{ secrets.OPENFORT_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SHIELD_API_KEY=${{ secrets.OPENFORT_SHIELD_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --build-arg NEXT_PUBLIC_POLICY_ID=${{ secrets.POLICY_ID }} \
            --build-arg NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=production \
            -t "$ACR_REGISTRY/infra-dashboard:prod" \
            -t "$ACR_REGISTRY/infra-dashboard:prod-$SHA" .
          docker push "$ACR_REGISTRY/infra-dashboard:prod"
          docker push "$ACR_REGISTRY/infra-dashboard:prod-$SHA"

  deploy:
    name: Deploy to Production Server
    runs-on: [self-hosted, prod]
    needs: build
    env:
      SHIELD_SECRET: ${{ secrets.OPENFORT_SHIELD_SECRET_KEY }}
      SHIELD_SHARE: ${{ secrets.OPENFORT_SHIELD_ENCRYPTION_SHARE }}
      COMPOSE_FILE: ${{ vars.DOCKER_COMPOSE_PATH_PRODUCTION }}
    steps:
      - name: Write runtime secrets to env file
        run: |
          printf 'OPENFORT_SHIELD_SECRET_KEY=%s\nOPENFORT_SHIELD_ENCRYPTION_SHARE=%s\n' \
            "$SHIELD_SECRET" "$SHIELD_SHARE" > /tmp/dashboard-prod.env

      - name: Deploy with Docker Compose
        run: |
          docker compose -f "$COMPOSE_FILE" \
            --env-file /tmp/dashboard-prod.env \
            up -d dashboard --force-recreate

      - name: Wait for healthy state
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-dashboard-prod 2>/dev/null || echo "unknown")
            echo "Attempt $i/12 — health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Container did not become healthy within 60s"
          docker compose -f "$COMPOSE_FILE" logs --tail=50 dashboard
          exit 1

      - name: Cleanup temp env file
        if: always()
        run: rm -f /tmp/dashboard-prod.env
