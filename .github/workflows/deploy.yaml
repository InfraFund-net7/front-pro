name: Deploy to Production Environment
on:
  push:
    branches: ['main']

jobs:
  build:
    name: Build and push Docker image
    runs-on: [self-hosted, prod]
    env:
      ACR_REGISTRY: infrafund.azurecr.io
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to ACR
        run: echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
      - name: Build and push Docker image
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build \
            -f ./deployment/Dockerfile \
            --build-arg NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.PRIVY_APP_ID }} \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} \
            --build-arg NEXT_PUBLIC_ENVIRONMENT=production \
            -t "$ACR_REGISTRY/infra-dashboard:prod" \
            -t "$ACR_REGISTRY/infra-dashboard:prod-$SHA" .
          docker push "$ACR_REGISTRY/infra-dashboard:prod"
          docker push "$ACR_REGISTRY/infra-dashboard:prod-$SHA"

  deploy:
    name: Deploy to Production Server
    runs-on: [self-hosted, prod]
    needs: build
    env:
      # Deploy the compose file straight from the checked-out repo instead of
      # a manually-maintained VM-side copy (vars.DOCKER_COMPOSE_PATH_PRODUCTION)
      # -- the dev equivalent of that copy silently drifted from the repo
      # (still had Openfort/Shield vars long after this app moved to Privy),
      # so verify this one is deleted/unused on the prod VM too.
      COMPOSE_FILE: ./deployment/docker-compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            --network internal \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/prisma:/app/prisma" \
            -v "$PWD/prisma.config.ts:/app/prisma.config.ts" \
            -w /app \
            node:22-alpine \
            sh -c "npm install prisma@7.8.0 --no-save --silent && npx prisma migrate deploy"
          # NOTE: unlike dev, this has no baseline/resolve fallback for a
          # pre-existing schema with no _prisma_migrations history -- prod's
          # actual DB state hasn't been inspected. If this fails with P3005,
          # investigate prod's schema state before baselining (do not assume
          # it matches dev's).

      - name: Write runtime secrets to env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
        run: |
          printf 'DATABASE_URL=%s\nAPP_JWT_SECRET=%s\nNEXT_PUBLIC_PRIVY_APP_ID=%s\nPRIVY_APP_SECRET=%s\n' \
            "$DATABASE_URL" \
            "$APP_JWT_SECRET" \
            "$NEXT_PUBLIC_PRIVY_APP_ID" \
            "$PRIVY_APP_SECRET" \
            > /tmp/dashboard-prod.env

      - name: Deploy with Docker Compose
        run: |
          docker compose -f "$COMPOSE_FILE" \
            --env-file /tmp/dashboard-prod.env \
            up -d dashboard --force-recreate

      - name: Wait for healthy state
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-dashboard-prod 2>/dev/null || echo "unknown")
            echo "Attempt $i/12 — health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Container did not become healthy within 60s"
          docker compose -f "$COMPOSE_FILE" logs --tail=50 dashboard
          exit 1

      - name: Cleanup temp env file
        if: always()
        run: rm -f /tmp/dashboard-prod.env
