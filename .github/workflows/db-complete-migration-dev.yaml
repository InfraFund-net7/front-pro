name: Complete partial migration on Dev DB (manual, one-off)

# One-off remediation for 20260807220000_clean_project_draft_step_enum,
# which failed partway through on the dev DB: db-diagnose-dev.yaml confirmed
# project_draft_step (new, 6-value) and project_draft_step_old (original,
# still attached to projects.current_step) both currently exist, with one
# row still holding the now-removed 'crowdfunding_model' value. This
# finishes exactly that partial state -- fix the row, swap the column to
# the already-created new type, restore the default, drop the old type --
# then marks the migration applied so `prisma migrate deploy` stops
# reporting P3009. Wrapped in one transaction; not meant to be reused.

on:
  workflow_dispatch:

jobs:
  complete-migration:
    name: Finish enum swap + resolve migration bookkeeping
    runs-on: [self-hosted, dev]
    steps:
      - name: Complete the column type swap
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          docker run --rm \
            --network internal \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18-alpine \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '
              BEGIN;

              UPDATE "projects" SET "current_step" = '"'"'contact_information'"'"'
                WHERE "current_step" IN ('"'"'crowdfunding_model'"'"', '"'"'asset_symbol'"'"');

              ALTER TABLE "projects"
                ALTER COLUMN "current_step" TYPE "project_draft_step"
                USING ("current_step"::text::"project_draft_step");

              ALTER TABLE "projects" ALTER COLUMN "current_step" SET DEFAULT '"'"'contact_information'"'"';

              DROP TYPE "project_draft_step_old";

              COMMIT;
            '

      - name: Verify resulting state
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          docker run --rm \
            --network internal \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18-alpine \
            sh -c '
              echo "=== enum types (expect only project_draft_step) ===" &&
              psql "$DATABASE_URL" -c "SELECT typname FROM pg_type WHERE typname LIKE '"'"'project_draft_step%'"'"';" &&
              echo "=== projects.current_step column type ===" &&
              psql "$DATABASE_URL" -c "SELECT udt_name FROM information_schema.columns WHERE table_name = '"'"'projects'"'"' AND column_name = '"'"'current_step'"'"';" &&
              echo "=== rows by current_step value ===" &&
              psql "$DATABASE_URL" -c "SELECT current_step, count(*) FROM projects GROUP BY current_step ORDER BY 1;"
            '

      - name: Mark migration as applied
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          docker run --rm \
            --network internal \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/prisma:/app/prisma" \
            -v "$PWD/prisma.config.ts:/app/prisma.config.ts" \
            -w /app \
            node:22-alpine \
            sh -c "npm install prisma@7.8.0 --no-save --silent && npx prisma migrate resolve --applied 20260807220000_clean_project_draft_step_enum"
