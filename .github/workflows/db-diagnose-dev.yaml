name: Diagnose Dev DB (manual, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Inspect project_draft_step / _prisma_migrations state
    runs-on: [self-hosted, dev]
    steps:
      - name: Query dev database (read-only)
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          docker run --rm \
            --network internal \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18-alpine \
            sh -c '
              echo "=== _prisma_migrations row for the failing migration ===" &&
              psql "$DATABASE_URL" -c "SELECT migration_name, started_at, finished_at, rolled_back_at, logs FROM _prisma_migrations WHERE migration_name = '"'"'20260807220000_clean_project_draft_step_enum'"'"';" &&
              echo "=== enum types currently named project_draft_step* ===" &&
              psql "$DATABASE_URL" -c "SELECT typname FROM pg_type WHERE typname LIKE '"'"'project_draft_step%'"'"';" &&
              echo "=== current enum values on project_draft_step ===" &&
              psql "$DATABASE_URL" -c "SELECT enumlabel FROM pg_enum e JOIN pg_type t ON e.enumtypid = t.oid WHERE t.typname = '"'"'project_draft_step'"'"' ORDER BY enumsortorder;" &&
              echo "=== projects.current_step column type ===" &&
              psql "$DATABASE_URL" -c "SELECT udt_name FROM information_schema.columns WHERE table_name = '"'"'projects'"'"' AND column_name = '"'"'current_step'"'"';" &&
              echo "=== rows by current_step value ===" &&
              psql "$DATABASE_URL" -c "SELECT current_step, count(*) FROM projects GROUP BY current_step ORDER BY 1;"
            '
